<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Web Teleprompter with Video Recorder</title>
    <style>
        :root {
            --bg-color: #111;
            --text-color: #ffffff;
            --panel-bg: #222;
            --accent-color: #00adb5;
            --record-color: #ff3333;
            --border-color: #333;
            --preview-border: #444;
            --controls-height: 72px; /* updated dynamically on mobile */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           CONTROL PANEL
           ========================= */
        #control-panel {
            background-color: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--border-color);
            z-index: 20;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-size: 14px;
            color: #ccc;
            white-space: nowrap;
        }

        input[type="range"] {
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, filter 0.2s;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: #444;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            filter: none;
        }

        #btn-record {
            background-color: var(--record-color);
        }

        /* =========================
           MAIN LAYOUT
           ========================= */
        #workspace {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        /* =========================
           PROMPTER
           ========================= */
        #prompter-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding: 40vh 5% 50vh 5%;
            scroll-behavior: auto;
            min-height: 0;
        }

        /* Hide scrollbar */
        #prompter-container::-webkit-scrollbar {
            display: none;
        }

        #prompter-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #prompter-text {
            font-size: 44px;
            line-height: 1.6;
            font-weight: 600;
            white-space: pre-wrap;
            text-align: center;
            outline: none;
            word-break: break-word;
        }

        .flipped {
            transform: scaleX(-1);
        }

        /* Visual cue marker */
        #cue-marker {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 60px;
            margin-top: -30px;
            border-top: 2px dashed rgba(0, 173, 181, 0.4);
            border-bottom: 2px dashed rgba(0, 173, 181, 0.4);
            pointer-events: none;
            z-index: 5;
        }

        /* =========================
           CAMERA PREVIEW
           ========================= */
        #preview-container {
            width: 240px;
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #000;
            border: 2px solid var(--preview-border);
            border-radius: 10px;
            overflow: hidden;
            z-index: 25;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #webcam-preview {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
            background: #000;
        }

        #recording-indicator {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(255, 0, 0, 0.85);
            color: white;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
            text-transform: uppercase;
            display: none;
            animation: pulse 1s infinite alternate;
            z-index: 2;
        }

        #camera-status {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            font-size: 12px;
            color: #ddd;
            background: rgba(0,0,0,0.45);
            padding: 4px 6px;
            border-radius: 4px;
            text-align: center;
            display: none;
            z-index: 2;
        }

        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        /* =========================
           MOBILE LAYOUT
           ========================= */
        @media (max-width: 768px) {
            body {
                height: 100dvh;
                padding-bottom: calc(var(--controls-height) + env(safe-area-inset-bottom));
            }

            #control-panel {
                position: fixed;
                left: 0;
                bottom: 0;
                width: 100%;
                min-height: var(--controls-height);
